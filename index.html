  function explore(){const live=db.posts.filter(isLive),liveProjects=new Set(live.map(p=>p.project)).size,recent=live.filter(p=>daysAgo(p.confirmedOn)<=7).length;return `<section class="intro"><div><div class="eyebrow">${ic('sparkle',13)} 분양상담사를 위한 현장 탐색</div><h1>다음 현장, 조건부터 비교하세요.</h1><p>현장 정보와 조직별 모집조건을 한눈에. 나에게 맞는 다음 현장을 찾아보세요.</p></div><div class="metrics"><div class="metric"><div class="metric-label">모집 중인 현장</div><div class="metric-value">${String(liveProjects).padStart(2,'0')}<span>곳</span></div></div><div class="metric"><div class="metric-label">최근 7일 내 확인</div><div class="metric-value">${recent}<span>건</span></div></div></section><section class="search-panel" aria-label="현장 검색과 필터"><div class="search-row">${ic('search',21)}<input id="search-input" class="search-input" type="search" value="${esc(filter.q)}" placeholder="현장명이나 지역을 검색하세요" aria-label="현장명 또는 지역 검색" autocomplete="off"><span class="search-key">⌘ K</span></div><div class="filter-row"><label class="select-shell">${ic('pin',14)}<select id="region-filter" aria-label="지역 선택">${regionOptions()}</select></label><label class="select-shell">${ic('people',14)}<select id="role-filter" aria-label="모집 직급">${['팀원','팀장','본부장','팀'].map(r=>`<option value="${r}" ${filter.role===r?'selected':''}>${r==='팀'?'팀 전체 금액':r==='팀원'?'개인(팀원) 모집':r+' 모집'}</option>`).join('')}</select></label><span class="filter-divider"></span>${[['ad','ad','광고비 지원'],['db','database','DB 제공'],['daily','wallet','일비 지원'],['housing','bed','숙소 지원']].map(([key,icon,label])=>`<button class="filter-chip ${filter.supports.includes(key)?'on':''}" data-action="support-filter" data-key="${key}" aria-pressed="${filter.supports.includes(key)}">${ic(icon,14)}${label}</button>`).join('')}<button class="filter-reset" data-action="reset-filters">${ic('refresh',12)}초기화</button></div><div class="advanced-row"><label class="check-label"><input id="conditional-filter" type="checkbox" ${filter.includeConditional?'checked':''}>조건부 지원 포함</label><label class="check-label"><input id="ended-filter" type="checkbox" ${filter.includeEnded?'checked':''}>종료·만료 공고 포함</label><label class="switch-line">지역 기준 <select id="basis-filter" aria-label="지역 필터 기준"><option value="work" ${filter.basis==='work'?'selected':''}>실제 근무지</option><option value="project" ${filter.basis==='project'?'selected':''}>현장 소재지</option></select></label></div></section><div class="results-layout"><section id="results" aria-live="polite">${resultsHtml()}</section><aside class="aside-column"><div class="info-card"><div class="info-title">${ic('sliders',17)}같은 기준으로 비교하세요</div><div class="guide-items"><div class="guide-item"><span class="guide-number">01</span><div><h4>내가 받는 금액인가요?</h4><p>팀 전체 RT와 개인 수수료는<br>서로 다른 조건이에요.</p></div></div><div class="guide-item"><span class="guide-number">02</span><div><h4>언제, 어떤 조건으로 받나요?</h4><p>지급시점과 해약 시 환수조건을<br>금액과 함께 확인하세요.</p></div></div><div class="guide-item"><span class="guide-number">03</span><div><h4>어디로 출근하나요?</h4><p>현장 위치와 실제 근무지가<br>다를 수 있어요.</p></div></div></div></div><div class="aside-note"><strong>현재 화면은 수도권 가상 데이터입니다.</strong><br>표시된 모집조건은 실제 영업조건이 아닙니다.<br>확인일은 ${dateLabel(TODAY)} 기준으로 계산합니다.</div></aside></div>`;}
  function regionOptions(){return ['all',...[...new Set(SEED.projects.map(p=>p.region).concat(db.posts.map(p=>p.work)))].sort()].map(r=>`<option value="${esc(r)}" ${filter.region===r?'selected':''}>${r==='all'?'전체 지역':esc(r)}</option>`).join('');}
  function resultsHtml(){const list=results(),count=list.length;return `<div class="result-header"><div class="result-title">${filter.includeEnded?'확인된 현장':'모집 중인 현장'} <strong>${count}</strong><span class="muted small">곳</span></div><select id="sort-filter" class="sort-select" aria-label="정렬"><option value="newest" ${filter.sort==='newest'?'selected':''}>최근 공고 등록순</option><option value="fee" ${filter.sort==='fee'?'selected':''}>동일 기준 수수료 높은순</option></select></div>${filter.sort==='fee'?'<div class="result-note">선택 직급 · '+roleLabel(filter.role)+' · 세전 · 1계약당 고정금액 공고만 비교합니다. 협의·금액 비공개·종료 공고는 제외합니다.</div>':''}${filter.supports.length?'<div class="result-note">선택한 지원조건을 <strong>동시에 충족하는 개별 공고</strong>만 표시합니다. 서로 다른 조직의 혜택을 합치지 않습니다.</div>':''}${count?`<div class="project-list">${list.map(x=>projectCard(x.p,x.jobs)).join('')}</div><div class="list-end">현재 조건에 맞는 ${count}개 현장을 모두 확인했어요.</div>`:empty('search','조건에 맞는 모집정보가 없어요.','현재 리드요의 가상 데이터에서 확인된 결과가 없습니다.<br>지역이나 지원조건을 변경해 보세요.','필터 초기화','reset-filters')}`;}
  function empty(icon,title,text,label,action,attrs=''){return `<div class="empty-state"><div class="empty-icon">${ic(icon,29)}</div><h3>${title}</h3><p>${text}</p>${label?`<button class="btn primary" data-action="${action}" ${attrs}>${label}${ic('arrow',15)}</button>`:''}</div>`;}
  function updateResults(){if(document.querySelector('.map-app')){refreshMapList({fit:true,clearSelection:true,clearBounds:true});track('directory_filtered',{filter:{...filter,q:filter.q?'[search entered]':''},count:results().length});return;}const el=document.getElementById('results');if(el)el.innerHTML=resultsHtml();document.querySelectorAll('[data-action="support-filter"]').forEach(btn=>{const on=filter.supports.includes(btn.dataset.key);btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',String(on));});track('directory_filtered',{filter:{...filter,q:filter.q?'[search entered]':''},count:results().length});}
  function detail(id){const p=project(id);if(!p)return empty('search','현장을 찾을 수 없어요.','선택한 현장 정보가 없습니다.','현장 목록으로','nav','data-route="explore"');const all=db.posts.filter(j=>j.project===id&&j.status!=='pending'),matching=all.filter(j=>rateFor(j,detailRole)&&(detailEnded||isLive(j))).map(j=>asRate(j,detailRole)),active=all.filter(isLive);return `<button class="back-btn" data-action="nav" data-route="explore">${ic('back',15)}현장 목록으로</button><section class="detail-hero"><div class="detail-title">${building(p)}<div><span class="pill sky">민간 일반분양 아파트</span><h1>${esc(p.name)}</h1><div class="detail-meta">${ic('pin',13)}${esc(p.region+' '+p.district)} 일대 <span>·</span><span>가상 현장</span></div></div></div><button class="btn secondary sm" data-action="report" data-project="${id}">${ic('flag',13)}정보 정정</button></section><dl class="detail-summary"><div class="detail-stat"><dt>전체 세대수</dt><dd>${num(p.units)}세대</dd><small>실시간 잔여세대가 아닙니다</small></div><div class="detail-stat"><dt>분양가격 · ${p.priceType}</dt><dd>${esc(p.price)}</dd><small>발코니 확장·옵션 별도</small></div><div class="detail-stat"><dt>입주 예정</dt><dd>${dateLabel(p.moveIn)}</dd><small>상품정보 예시</small></div><div class="detail-stat"><dt>현재 모집조직</dt><dd>${new Set(active.map(j=>j.org)).size}개 조직</dd><small>모든 직급 기준 · 가상 공고</small></div></dl><section aria-label="모집조건 비교"><div class="section-heading"><div><h2>같은 현장, 다른 모집조건</h2><p>수수료뿐 아니라 지급시점, 실제 근무지까지 함께 비교하세요.</p></div><button class="link-btn" data-action="comparison-guide">비교 기준 ${ic('info',13)}</button></div><div class="comparison-controls"><div class="role-tabs" role="group" aria-label="비교할 직급">${['팀원','팀장','본부장','팀'].map(r=>`<button class="role-tab ${detailRole===r?'active':''}" data-action="detail-role" data-role="${r}" aria-pressed="${detailRole===r}">${roleLabel(r)}<span>${all.filter(j=>rateFor(j,r)&&(detailEnded||isLive(j))).length}</span></button>`).join('')}</div><label class="check-label"><input id="detail-ended" type="checkbox" ${detailEnded?'checked':''}>종료·만료 공고 포함</label></div>${matching.length?comparison(matching):empty('briefcase','현재 확인된 '+esc(detailRole)+' 모집정보가 없어요.','다른 직급을 선택하거나 종료·만료 공고를 확인해 보세요.','','')}<div class="table-helper">${ic('info',13)}<span>모든 공고는 가상 데이터입니다. 담당자 확인일은 실제 지급이나 조건의 진실성을 보장하는 인증이 아닙니다.</span></div></section><div class="lower-grid"><div class="panel"><h2>현장 기본정보</h2><dl class="property-grid">${propertyRow('현장 소재지',p.region+' '+p.district+' 일대 (가상)')}${propertyRow('주택형',p.types)}${propertyRow('사업주체',p.supplier)}${propertyRow('시공사',p.builder)}${propertyRow('계약금',p.deposit)}${propertyRow('현재 잔여물량','미확인 — 임의 추정하지 않음')}${propertyRow('중도금 조건',p.interim,true)}${propertyRow('가격 기준',p.priceType+' · 발코니 확장·유상옵션 별도',true)}</dl><div class="source-box"><strong>출처와 확인 범위</strong><br>화면 구성을 위한 가상 자료입니다. 청약홈·공식 분양자료·모집자 인증은 연결되어 있지 않습니다. 실제 서비스에서는 항목별 출처, 자료 발표일, 담당자 확인일을 구분합니다.<br>샘플 기준일: ${dateLabel(TODAY)}</div></div></div>`;}
  function propertyRow(label,val,wide=false){return `<div class="property-row ${wide?'wide':''}"><dt>${label}</dt><dd>${esc(val)}</dd></div>`;}
  function comparison(jobs){const cells=fn=>jobs.map(p=>`<td>${fn(p)}</td>`).join('');const row=(label,fn,cls='')=>`<tr class="${cls}"><th scope="row" class="row-heading">${label}</th>${cells(fn)}</tr>`;const min=139+jobs.length*235;return `<div class="table-container" tabindex="0" aria-label="조직별 모집조건 비교표. 좁은 화면에서는 가로로 스크롤하세요."><table class="comparison-table" style="min-width:${Math.max(min,450)}px"><colgroup><col style="width:139px">${jobs.map(()=>'<col>').join('')}</colgroup><thead><tr><th class="row-heading" scope="col">모집조직</th>${jobs.map(p=>{const o=org(p.org);return `<th scope="col"><div class="org-heading"><div class="org-symbol">${esc(initials(o.name))}</div><div><h3>${esc(o.name)}</h3><p>${esc(o.type)} · ${esc(o.unit)}</p></div></div>${statusPill(p)}<div class="org-confirmed">${ic('clock',12)}${ago(p.confirmedOn)} 확인 · 예시</div></th>`;}).join('')}</tr></thead><tbody>${row('수수료',p=>`<div class="comparison-fee">${money(p)}</div><div class="compare-small">${esc(roleLabel(p.role))} · 1계약당 · ${esc(p.unit)}<br>${esc(p.tax)}${p.role==='팀'?'<br><strong>개인 수령액이 아닙니다.</strong>':''}</div>`)}${row('지급 발생조건',p=>esc(p.trigger))}${row('지급시점',p=>esc(p.payment))}${row('해약·환수조건',p=>esc(p.clawback))}${row('실제 근무지',p=>`<strong>${esc(p.work)}</strong><div class="compare-small">${p.work===project(p.project).region?'현장과 같은 지역':'현장 소재지와 다른 지역'}</div>`)}${row('광고비',p=>supportStatus(p.ad)+`<div class="compare-small">${esc(p.adNote)}</div>`)}${row('고객 DB',p=>supportStatus(p.db)+`<div class="compare-small">${esc(p.dbNote)}</div>`)}${row('일비',p=>supportStatus(p.daily)+`<div class="compare-small">${esc(p.dailyNote)}</div>`)}${row('숙소',p=>supportStatus(p.housing)+`<div class="compare-small">${p.housing==='yes'?'인원·개인부담금은 별도 확인':p.housing==='conditional'?'입실 가능 여부·부담조건 별도 협의':p.housing==='unknown'?'제공 여부를 확인하지 못했습니다.':'숙소 제공 없음'}</div>`)}${row('계약형태·참고',p=>`${esc(p.employment)}<div class="compare-small">${esc(p.note)}</div>`)}${row('출처 · 조건 버전',p=>`모집 담당자 제공 (가상)<div class="compare-small">${dateLabel(p.confirmedOn)} 확인 · v${p.version}<br>등록 ${dateLabel(p.published)}</div>`)}${row('모집 담당자 문의',p=>demoRole==='admin'?'—':`<button class="btn ${isLive(p)?'primary':'secondary'} full" data-action="inquire" data-post="${p.id}" data-role="${p.role}" ${!isLive(p)?'disabled':''}>${ic(isLive(p)?'message':'lock',14)}${isLive(p)?'1:1 문의':'신규 문의 불가'}</button>${isLive(p)?`<button class="btn ghost full sm" style="margin-top:7px" data-action="phone" data-post="${p.id}" data-role="${p.role}">${ic('phone',13)}전화문의</button>`:''}`,'cta-row')}</tbody></table></div><div class="scroll-hint">${ic('arrowLeftRight',13)}표를 좌우로 움직여 모든 조직의 조건을 확인하세요.</div>`;}
  function inquiriesView(received=false,embedded=false){
    const items=db.inquiries.filter(i=>received?i.org===SEED.demoOrg:(i.senderRole||'counselor')===demoRole);

  function rateFields(d){const roles=d.roles||[];const rows=roles.map(role=>{const code=ROLE_CODES[role],r=d.rateDrafts?.[role]||{disclosure:'fixed',amount:''};return `<div class="rate-entry"><strong>${esc(role==='팀'?'팀 RT 총액':roleLabel(role)+' RT')}</strong><div class="rate-entry-fields"><label for="rate-disclosure-${code}">공개 방식<select id="rate-disclosure-${code}" name="rate-disclosure-${code}" data-rate-role="${code}"><option value="fixed" ${r.disclosure==='fixed'?'selected':''}>금액 공개</option><option value="private" ${r.disclosure==='private'?'selected':''}>협의·비공개</option></select></label><label for="rate-amount-${code}">1계약당 금액 (만 원)<input id="rate-amount-${code}" name="rate-amount-${code}" type="number" min="0.1" max="100000" step="0.1" value="${esc(r.amount??'')}" placeholder="예: 650" ${r.disclosure==='private'?'disabled':'required'}></label></div></div>`;}).join('');const derived=roles.includes('팀원')&&roles.includes('팀장')&&!roles.includes('팀');return `<div class="rate-editor" id="post-rate-editor"><div class="rate-editor-intro"><strong>1계약당 RT 금액</strong><p>선택한 모집 대상의 금액을 각각 입력하세요. 팀장과 팀원 금액을 입력하면 팀 RT 합계를 자동으로 표시합니다.</p></div>${rows||'<p class="map-rate-note">모집 대상을 선택하면 RT 입력칸이 나타납니다.</p>'}${derived?'<div class="team-rt-preview"><span>팀 RT 합계 <small>팀장 + 팀원</small></span><strong id="derived-team-amount">금액 입력 후 계산</strong></div>':''}</div>`;}
  function syncTeamPreview(){const preview=document.getElementById('derived-team-amount');if(!preview)return;const member=document.getElementById('rate-amount-member'),leader=document.getElementById('rate-amount-leader');const ready=member&&!member.disabled&&Number(member.value)>0&&leader&&!leader.disabled&&Number(leader.value)>0;preview.textContent=ready?num(Math.round((Number(member.value)+Number(leader.value))*10)/10)+'만 원':'두 금액 공개 시 자동 계산';}
  function updateRoleRateChoices(){const form=document.getElementById('post-form');if(!form||formStep!==1)return;for(const role of formDraft.roles||[]){const code=ROLE_CODES[role],disclosure=document.getElementById('rate-disclosure-'+code),amount=document.getElementById('rate-amount-'+code);if(disclosure)formDraft.rateDrafts[role]={disclosure:disclosure.value,amount:amount?.disabled?'':amount?.value||''};}formDraft.roles=[...form.querySelectorAll('[name="roles"]:checked')].map(el=>el.value);document.getElementById('post-rate-editor').outerHTML=rateFields(formDraft);syncTeamPreview();}
  function renderPostForm(){const d=formDraft;let content='';if(formStep===1){content=`<div class="context-card"><strong>${esc(org(d.org).name+' · '+org(d.org).unit)}</strong><p>${demoRole==='admin'?'운영관리자가 이 조직의 가상 공고를 수정합니다.':'이 데모 조직의 모집공고로 등록됩니다.'} 실제 조직 신원 확인은 연결되지 않았습니다.</p></div><div class="form-grid">${selectField('project','모집할 현장',d.project,SEED.projects.map(p=>[p.id,p.name]),{wide:true,required:true})}<fieldset class="rate-choices"><legend>모집 대상 <span class="required">*</span></legend>${ROLE_CHOICES.map(([role,label])=>`<label class="rate-choice"><input type="checkbox" name="roles" value="${role}" ${d.roles.includes(role)?'checked':''}><span>${role==='팀'?'팀 RT만 입력':label}${role==='팀'?'<small>팀장·팀원 배분액 없이 총액만 알 때</small>':''}</span></label>`).join('')}</fieldset>${rateFields(d)}${selectField('work','실제 근무지',d.work,[...new Set(SEED.projects.map(p=>p.region))].sort(),{required:true})}${field('employment','계약형태',d.employment,{wide:true,required:true,hint:'실제 계약형태는 모집자가 확인해야 합니다. 이 화면은 가상 등록입니다.'})}</div>`;}else if(formStep===2){content=`<div class="context-card"><strong>${esc(project(d.project).name)} · 지급 기준과 시점</strong><p>앞 단계에서 입력한 RT의 세금 기준, 지급 발생조건과 환수조건을 적어 주세요.</p></div><div class="form-grid">${selectField('tax','금액 표기 기준',d.tax,['세전 기준','세후 기준','기준 미확인'],{required:true})}${field('trigger','지급 발생조건',d.trigger,{required:true,placeholder:'예: 계약금 완납'})}${field('payment','실제 지급시점',d.payment,{wide:true,required:true,placeholder:'예: 계약금 완납 후 14영업일 이내'})}${field('clawback','해약·환수 및 제외조건',d.clawback,{wide:true,required:true,placeholder:'확인되지 않은 경우 “확인 필요”로 입력'})}</div>`;}else{const states=[['unknown','미확인'],['yes','지원'],['conditional','조건부 지원'],['no','미지원']];content=`<div class="form-grid">${selectField('ad','광고비',d.ad,states)}${selectField('db','고객 DB',d.db,states)}${field('adNote','광고비 적용조건',d.adNote,{placeholder:'지원 범위·비용 부담 조건'})}${field('dbNote','DB 제공조건',d.dbNote,{placeholder:'공동 배분·수량 보장 여부'})}${selectField('daily','일비',d.daily,states)}${selectField('housing','숙소',d.housing,states)}${field('dailyNote','일비 세부조건',d.dailyNote,{wide:true,placeholder:'예: 출근일 3만 원 · 지급조건 별도'})}${field('note','숙소 조건 / 모집 참고사항',d.note,{wide:true,textarea:true})}</div><label class="consent"><input name="consent" type="checkbox" ${d.consent?'checked':''} required><span>가상의 모집조건임을 이해하고 이 브라우저에 저장합니다. ${demoRole==='admin'?'운영관리자의 수정은 현재 공고 상태를 유지합니다.':'등록·수정 후 검수 대기 상태가 됩니다.'}</span></label>`;}
    showModal(formEditId?'모집공고 수정':'새 모집공고 등록',`<p class="modal-description">모집 대상과 1계약당 RT를 먼저 입력합니다. 모든 변경은 이 브라우저 안에서만 적용됩니다.</p><div class="stepper">${['현장·직급별 RT','지급 기준·시점','지원조건·승인'].map((t,i)=>`${i?'<span class="step-line"></span>':''}<span class="step ${formStep===i+1?'current':formStep>i+1?'complete':''}"><b>${formStep>i+1?'✓':i+1}</b>${t}</span>`).join('')}</div><form id="post-form"><div class="form-error" id="post-error" role="alert"></div>${content}<div class="form-actions"><button type="button" class="btn secondary" data-action="${formStep===1?'close-modal':'post-prev'}">${formStep===1?'취소':'이전'}</button><button type="submit" class="btn primary">${formStep===3?(demoRole==='admin'?'수정 저장':'검수 대기로 저장'):'다음 단계'}${ic('arrow',15)}</button></div><p class="modal-footer-note">실제 게시, 모집자 승인·인증, 검수 시스템은 연결되지 않았습니다.</p></form>`,690);syncTeamPreview();}
  function collectDraft(){const form=document.getElementById('post-form');if(!form)return;const fd=new FormData(form);if(formStep===1){formDraft.roles=fd.getAll('roles').map(String);formDraft.rateDrafts||={};for(const role of formDraft.roles){const code=ROLE_CODES[role];formDraft.rateDrafts[role]={disclosure:String(fd.get('rate-disclosure-'+code)||'fixed'),amount:String(fd.get('rate-amount-'+code)||'').trim()};}}for(const [k,v]of fd.entries())if(k!=='roles'&&!k.startsWith('rate-'))formDraft[k]=String(v).trim();if(formStep===3)formDraft.consent=fd.has('consent');}
  function submitPost(){collectDraft();if(formStep<3){const error=document.getElementById('post-error');if(formStep===1&&!formDraft.roles.length){error.textContent='모집 대상을 하나 이상 선택해 주세요.';error.classList.add('show');return;}if(formStep===1){const invalid=formDraft.roles.find(role=>{const r=formDraft.rateDrafts[role];return r.disclosure==='fixed'&&(!Number.isFinite(Number(r.amount))||Number(r.amount)<=0);});if(invalid){error.textContent=roleLabel(invalid)+'의 1계약당 RT를 입력해 주세요.';error.classList.add('show');return;}}formStep++;renderPostForm();return;}const d=formDraft,old=formEditId?owned(formEditId):null;if(formEditId&&!old)return;const rates=d.roles.map(role=>{const r=d.rateDrafts[role];return {role,amount:r.disclosure==='fixed'?Number(r.amount):null,unit:role==='팀'?'팀 전체':'개인'};});const primary=rates[0];const value={...clone(d),id:old?.id||uid('job'),org:old?.org||SEED.demoOrg,role:primary.role,amount:primary.amount,unit:primary.unit,rates,adNote:d.adNote||'세부조건 확인 필요',dbNote:d.dbNote||'세부조건 확인 필요',dailyNote:d.dailyNote||'세부조건 확인 필요',status:demoRole==='admin'&&old?old.status:'pending',confirmedOn:TODAY,published:old?.published||TODAY,version:(old?.version||0)+1,approval:true};delete value.roles;delete value.rateDrafts;delete value.consent;delete value.disclosure;if(old){db.posts[db.posts.findIndex(p=>p.id===old.id)]=value;}else db.posts.push(value);persist();track('demo_listing_submitted',{post:value.id,version:value.version});render();showModal('검수 대기 저장 완료',`<div class="success-view"><div class="success-symbol">${ic('document',28)}</div><h2>직급별 금액이 정리되었어요.</h2><p>${demoRole==='admin'?'운영관리자가 공고 변경사항을 저장했습니다.':'공고는 아직 목록에 공개되지 않았습니다.<br>운영관리자 화면에서 승인할 수 있습니다.'}</p><div class="context-card"><strong>${esc(project(value.project).name)} · 모집공고</strong><p>${esc(ratesSummary(value))}<br>${esc(org(value.org).name+' · '+org(value.org).unit)} / 조건 v${value.version}</p></div>${demoRole==='admin'?'':`<button class="btn primary full" data-action="choose-role">운영관리자 화면으로 전환 ${i   function reviewModal(){if(demoRole!=='admin'){toast('운영관리자 화면에서 검수할 수 있습니다.');return;}const posts=db.posts.filter(p=>p.status==='pending');showModal('검수 대기 공고',`<div class="notice-panel warning">${ic('info',16)}<div><strong>가상 공고 검수 화면입니다.</strong><br>승인하면 이 브라우저의 현장 목록에 표시됩니다. 실제 조직 신원과 자료 검증은 연결되지 않았습니다.</div></div>${posts.length?posts.map(p=>`<div class="review-card"><div class="between"><h3>${esc(project(p.project).name)}</h3>${pill('검수 대기','sky')}</div><p>${esc(org(p.org).name)} · ${esc(ratesSummary(p))}<br>${esc(p.payment)}<br>${esc(p.clawback)}</p><button class="btn primary sm" data-action="approve-post" data-post="${p.id}">가상 공고 승인</button></div>`).join(''):'<p class="modal-description">검수 대기 중인 가상 공고가 없습니다.</p>'}<div class="form-actions"><button class="btn secondary" data-action="close-modal">닫기</button><button class="link-btn" data-action="nav" data-route="manage">공고 관리로 이동 ${ic('arrow',13)}</button></div>`,620);}
